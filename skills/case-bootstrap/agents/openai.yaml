interface:
  display_name: "GG → Case Writing → Bootstrap"
  short_description: "Scaffold case folder, run intake, initialize state.json, route to next skill."
  icon_small: "./assets/icon-small.svg"
  icon_large: "./assets/icon-large.png"
  brand_color: '#2563EB'
  default_prompt: >-
    Use this skill to start a new business case study: it asks one missing
    intake fact at a time, then creates the case-<slug>/ folder, writes
    internal/intake.yaml and internal/state.json, and continues into the
    next skill in the same turn. Idempotent on re-run. Create no placeholder
    documents. End every turn with the harness question tool.
